# Config do Nginx para servir o SPA (React Router).
# Replica o comportamento do public/.htaccess (que só vale para Apache).
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Compressão
  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # SPA: qualquer rota que não seja arquivo/pasta real cai no index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Cache longo para assets com hash no nome.
  location ~* \.(js|css|svg|woff2|png|jpg|jpeg|gif|webp)$ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # HTML nunca é cacheado (garante que o usuário sempre pega a versão nova).
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }
}
